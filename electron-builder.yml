# electron-builder — https://www.electron.build/configuration
#
# The SvelteKit server is bundled into the app (build/), so there is no
# sidecar process to declare: desktop/main.js imports build/handler.js.
appId: io.peerhub.app
productName: PeerHub
# Who ships the build. `author` in package.json is what lands in the executable's
# Company field, so the two are the same person on purpose.
copyright: © 2026 Rodrigo David Benitez

directories:
  output: dist
  buildResources: resources

files:
  - desktop/**/*
  # The shell imports shared/data-dir.js at runtime, and the window icon is read
  # from resources/ — both must be inside the package.
  - shared/**/*
  # The `ph` command is a copy of this file plus shared/data-dir.js, written into
  # a per-user folder on boot (desktop/cli-install.js).
  - cli/**/*
  - build/**/*
  - resources/icon.png
  - package.json
  - '!**/*.map'

# sodium-native and rabin-native ship N-API .node prebuilds, which Electron
# loads as-is (no rebuild, no ABI match). They must stay outside the asar
# archive because dlopen cannot read from it.
asar: true
asarUnpack:
  - '**/*.node'
  - '**/prebuilds/**'

npmRebuild: false

win:
  target:
    - nsis
  # Publisher shown by the installer and in Add/Remove Programs, and the identity
  # of the signature: `npm run dist` makes sure a code-signing certificate with
  # this subject is in the user's store (scripts/signing-cert.mjs) and
  # electron-builder signs the exe, the uninstaller and the installer with it.
  signtoolOptions:
    publisherName: Rodrigo David Benitez
    certificateSubjectName: Rodrigo David Benitez
  # A committed multi-size .ico: electron-builder's png→ico converter is
  # unreliable (heap OOM on this toolchain), and Windows needs the real thing
  # at 16/32/48 anyway. resources/icon.png stays for mac/linux.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: PeerHub

mac:
  target:
    - dmg
  icon: resources/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: Development
  maintainer: PeerHub contributors
